<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Right Venue Invoices</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#096f3d">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style>
/* Layout: app shell — left nav rail, working area; invoice editor = form column + live pad preview */
:root{
  --bg:#f4f5f3; --surface:#ffffff; --surface-2:#f8f9f7; --ink:#1d1b1c; --muted:#646b66; --faint:#8f958f;
  --line:#e2e5e0; --line-strong:#cfd4cd;
  --green:#096f3d; --green-hi:#0b8549; --green-soft:#e3f2e9; --green-ink:#075a31;
  --red:#c72027; --red-soft:#fbe8e8; --red-ink:#a3181e;
  --gold:#f4bb24; --gold-soft:#fdf3d6; --gold-ink:#8a6200;
  --blue-soft:#e7eef8; --blue-ink:#2a4f86;
  --shadow:0 1px 2px rgba(20,24,20,.06),0 4px 16px rgba(20,24,20,.05);
  --overlay:rgba(20,22,20,.45);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121413; --surface:#1a1d1b; --surface-2:#202421; --ink:#ecefeb; --muted:#a3aaa4; --faint:#7b827c;
  --line:#2b302d; --line-strong:#3a403c;
  --green:#22a565; --green-hi:#2bbd74; --green-soft:#16321f; --green-ink:#7fd9a6;
  --red:#ef5157; --red-soft:#3a1c1e; --red-ink:#ff9a9e;
  --gold:#f4bb24; --gold-soft:#3a2f12; --gold-ink:#f7cf62;
  --blue-soft:#1b2738; --blue-ink:#9dbbe6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121413; --surface:#1a1d1b; --surface-2:#202421; --ink:#ecefeb; --muted:#a3aaa4; --faint:#7b827c;
  --line:#2b302d; --line-strong:#3a403c;
  --green:#22a565; --green-hi:#2bbd74; --green-soft:#16321f; --green-ink:#7fd9a6;
  --red:#ef5157; --red-soft:#3a1c1e; --red-ink:#ff9a9e;
  --gold:#f4bb24; --gold-soft:#3a2f12; --gold-ink:#f7cf62;
  --blue-soft:#1b2738; --blue-ink:#9dbbe6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  --overlay:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
.gate{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.gate-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:14px}
.gate-logo{display:block;width:220px;margin:0 auto;background:#fff;border-radius:10px;padding:8px 10px}
.gate-card h1{font-size:24px;text-align:center;margin-top:6px}
.g-p{margin:0;color:var(--muted);text-align:center}
.g-actions{display:flex;flex-direction:column;gap:10px}
.g-big{height:46px;width:100%;font-size:15px}
.nav-foot{display:flex;flex-direction:column;gap:8px}
.lock-btn{align-self:flex-start}
.dot.bad{background:var(--red)}
.steps-box{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px}
.uri{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.uri code{flex:1 1 200px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;word-break:break-all;user-select:all}
.m-bar{display:none}
.steps-box ol{margin:6px 0 0;padding-left:18px;color:var(--muted)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{background:#fff;border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.brand img{display:block;width:100%;height:auto}
.brand-sub{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px;padding-inline:4px}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--green-soft);color:var(--green-ink)}
.nav a svg{width:18px;height:18px;flex:none}
.nav .new-btn{margin-top:4px}
.nav a.mob-only-new{display:none}
.nav-foot{margin-top:auto;font-size:12px;color:var(--faint);padding-inline:4px}
.nav-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.nav-foot .dot.off{background:var(--gold)}

.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,min(40px,4vw));padding-right:max(16px,env(safe-area-inset-right,0px),min(40px,4vw))}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:28px;line-height:1.15}
.page-head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-hi);border-color:var(--green-hi)}
.btn.danger{color:var(--red-ink);border-color:var(--line-strong)}
.btn.danger.solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.icon{width:38px;padding:0}
.btn.sm.icon{width:32px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* cards & kpis */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card h2{font-size:16px;font-family:var(--ui);font-weight:700;letter-spacing:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .lbl i{width:8px;height:8px;border-radius:2px;display:inline-block}
.kpi .val{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:180px;padding-top:10px;border-bottom:1px solid var(--line);position:relative}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;position:relative;z-index:1}
.bar{width:min(42px,70%);border-radius:6px 6px 2px 2px;background:var(--green);min-height:2px;transition:height .3s}
.bar-col.now .bar{background:var(--gold)}
.bar-val{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chart-x{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:6px;font-size:12px;color:var(--muted);text-align:center;font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl .strong{font-weight:700}
.tbl .muted{color:var(--muted)}
.inv-no{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.draft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.sent{background:var(--blue-soft);color:var(--blue-ink)}
.pill.overdue{background:var(--red-soft);color:var(--red-ink)}
.pill.paid{background:var(--green-soft);color:var(--green-ink)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.search{position:relative;flex:1 1 220px;min-width:0}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.search input{padding-left:34px}

.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--ui);font-size:16px;color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
textarea.inp{height:auto;min-height:70px;padding:9px 11px;resize:vertical;line-height:1.45}
.inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12px;color:var(--faint)}
.sec{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-h h3{font-family:var(--ui);font-size:14px;font-weight:700}
.affix{position:relative}
.affix .inp{padding-right:30px}
.affix b{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--faint);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;height:38px}
.seg button{border:0;background:var(--surface);padding:0 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* line items */
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 70px 104px 32px;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.item textarea.inp{min-height:38px;height:38px;padding-top:8px}
.item .amt{grid-column:1 / -1;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.item .amt b{color:var(--ink);font-variant-numeric:tabular-nums}
.ded{display:grid;grid-template-columns:minmax(0,1fr) 120px 32px;gap:8px;align-items:center}
.ded .inp.neg{color:var(--red-ink)}
.add-link{align-self:flex-start;background:none;border:0;color:var(--green-ink);font-weight:700;cursor:pointer;padding:4px 0;display:inline-flex;gap:6px;align-items:center}
.add-link.red{color:var(--red-ink)}
.add-link svg{width:16px;height:16px}
.totals-mini{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.totals-mini div{display:flex;justify-content:space-between;gap:10px}
.totals-mini .neg{color:var(--red-ink)}
.totals-mini .big{font-weight:800;font-size:17px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.words{font-size:12.5px;color:var(--muted);font-style:italic}

/* editor */
.editor{display:grid;grid-template-columns:minmax(340px,460px) minmax(0,1fr);gap:20px;align-items:start}
.ed-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-block:10px;margin:-10px 0 10px}
.ed-bar .title{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.ed-bar h1{font-size:22px;font-variant-numeric:tabular-nums}
.save-state{font-size:12.5px;color:var(--faint);white-space:nowrap}
.preview-col{position:sticky;top:76px;min-width:0}
.preview-frame{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 100px);overflow:auto}
.preview-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.pv-page{position:relative;width:100%;overflow:hidden;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08)}
.pv-page>.paper{position:absolute;left:0;top:0;transform-origin:0 0}
.mob-tabs{display:none}
.editor[data-preview="off"]{grid-template-columns:minmax(0,780px)}
.editor[data-preview="off"] .preview-col{display:none!important}
#btnPv[aria-pressed="false"]{color:var(--muted)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:200px;z-index:20;display:flex;flex-direction:column}
.menu-pop button{display:flex;gap:9px;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:600}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop button svg{width:16px;height:16px}
.menu-pop .dz{color:var(--red-ink)}

/* buyers */
.buyers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.buyer{padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0}
.buyer:hover{border-color:var(--line-strong)}
.buyer-top{display:flex;gap:12px;align-items:center;min-width:0}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.buyer-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buyer-co{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buyer-email{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.buyer-stats{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
.buyer-stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* banners, modal, toast */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);font-weight:600;font-size:13.5px;margin-bottom:16px}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px}
.modal-bg{position:fixed;inset:0;background:var(--overlay);z-index:50;display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h h2{font-size:19px}
.modal-b{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.attach{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:10px;font-size:13px}
.attach svg{width:20px;height:20px;color:var(--red)}
.err{color:var(--red-ink);font-size:13px;font-weight:600}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);font-size:13.5px}
.toast.bad{background:var(--red)}

#exportHost{position:fixed;left:-12000px;top:0;width:794px;pointer-events:none}

/* ---------- invoice paper (always a printed document: fixed light ink on white pad) ---------- */
.paper{width:794px;height:1123px;position:relative;background:#ffffff;color:#231f20;font-family:"Figtree",Arial,sans-serif;font-size:12.5px;line-height:1.45;overflow:hidden}
.paper .pad{position:absolute;inset:0;width:794px;height:1123px;max-width:none}
.paper .zone{position:absolute;left:52px;right:52px;top:192px;height:690px;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.paper .pfoot{position:absolute;left:52px;right:52px;top:888px;display:flex;justify-content:space-between;font-size:9.5px;color:#7a7576}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.p-title{font-family:"Bricolage Grotesque","Figtree",Arial,sans-serif;font-size:34px;font-weight:800;line-height:1;color:#231f20}
.p-title-bar{display:flex;margin-top:8px;height:4px;width:120px}
.p-title-bar i{flex:1}
.p-meta{display:grid;grid-template-columns:auto auto;column-gap:16px;row-gap:3px;font-size:12px}
.p-meta dt{color:#7a7576}
.p-meta dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.p-parties{display:flex;justify-content:space-between;gap:24px;align-items:stretch}
.p-bill{flex:1;min-width:0}
.p-lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#096f3d;margin-bottom:4px}
.p-bill .nm{font-size:15px;font-weight:800}
.p-bill .ln{color:#4a4546;white-space:pre-wrap;overflow-wrap:anywhere}
.p-due{width:230px;flex:none;background:#f6f7f4;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;position:relative}
.p-due .amt{font-family:"Bricolage Grotesque","Figtree",Arial,sans-serif;font-size:26px;font-weight:800;color:#096f3d;line-height:1.1;font-variant-numeric:tabular-nums}
.p-due .by{font-size:11.5px;color:#4a4546;margin-top:2px}
.p-stamp{position:absolute;right:10px;top:-14px;transform:rotate(-8deg);border:2.5px solid #096f3d;color:#096f3d;font-weight:900;font-size:15px;letter-spacing:.12em;padding:2px 10px;border-radius:6px;background:#ffffff}
.p-tbl{width:100%;border-collapse:collapse;font-size:12px}
.p-tbl th{background:#231f20;color:#ffffff;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:8px 10px;text-align:left}
.p-tbl th.r,.p-tbl td.r{text-align:right}
.p-tbl td{padding:8px 10px;border-bottom:1px solid #e4e4e0;vertical-align:top;font-variant-numeric:tabular-nums}
.p-tbl td.d{white-space:pre-wrap;overflow-wrap:anywhere}
.p-tbl tr.alt td{background:#fafaf8}
.p-tbl .ix{color:#7a7576;width:28px}
.p-tbl thead tr.goldline th{padding:0;height:3px;background:#f4bb24}
.p-sum{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.p-words{flex:1;min-width:0;padding-top:4px}
.p-words .t{font-style:italic;color:#231f20;font-weight:600}
.p-totals{width:270px;flex:none;font-size:12.5px}
.p-totals div{display:flex;justify-content:space-between;padding:5px 10px;font-variant-numeric:tabular-nums}
.p-totals .neg{color:#c72027}
.p-totals .tot{background:#096f3d;color:#ffffff;font-weight:800;font-size:15px;border-radius:6px;margin-top:4px;padding:9px 10px}
.p-pay{display:flex;justify-content:space-between;gap:18px;align-items:center;border:1px solid #e4e4e0;border-radius:10px;padding:14px 16px;border-left:4px solid #f4bb24}
.p-pay .txt{flex:1;min-width:0}
.p-pay .h{font-weight:800;font-size:13.5px}
.p-pay .s{color:#4a4546;font-size:11.5px;margin:2px 0 9px}
.p-paybtn{display:inline-block;background:#096f3d;color:#ffffff;font-weight:800;font-size:12.5px;padding:8px 16px;border-radius:6px;text-decoration:none}
.p-link{font-size:9.5px;color:#7a7576;margin-top:6px;word-break:break-all}
.p-qr{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.p-qr img{width:92px;height:92px;display:block;image-rendering:pixelated}
.p-qr span{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#231f20}
.p-notes .t{white-space:pre-wrap;color:#4a4546;overflow-wrap:anywhere}
.p-cont{font-size:11px;color:#7a7576;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

@media (max-width:1180px){
  .editor{grid-template-columns:minmax(0,1fr)}
  .preview-col{position:static}
  .preview-frame{max-height:none}
  .mob-tabs{display:flex;margin-bottom:12px}
  .editor[data-tab="form"] .preview-col{display:none}
  .editor[data-tab="preview"] .form-col{display:none}
  .editor[data-preview="off"] .form-col{display:block!important}
}
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:30;gap:0}
  .brand,.brand-sub,.nav-foot,.nav .new-btn{display:none}
  .nav a.mob-only-new{display:flex}
  .nav-list{flex-direction:row;justify-content:space-around;width:100%}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}
  .main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .page-head h1{font-size:24px}
  .grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .item{grid-template-columns:minmax(0,1fr) 64px 92px 32px}
  .tbl .hide-sm{display:none}
  .toasts{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .m-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--faint);margin:-8px 0 14px}
  .inp,select.inp,textarea.inp{font-size:16px}
  .ed-bar .btn{height:36px;padding:0 11px}
}
@media (max-width:440px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 14px}
  .kpi .val{font-size:19px}
  .kpi .lbl{font-size:10.5px;letter-spacing:.04em}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:minmax(0,1fr) 56px 80px 32px;padding:8px;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script id="logic">
/* ---------- pure logic: money, words, numbering ---------- */
const MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const r2=n=>Math.round((Number(n)||0)*100)/100;
function calc(inv){
  const subtotal=r2((inv.items||[]).reduce((s,it)=>s+r2((Number(it.qty)||0)*(Number(it.rate)||0)),0));
  const pct=Number(inv.serviceChargePct)||0;
  const service=r2(subtotal*pct/100);
  const deductions=(inv.deductions||[]).map(d=>({label:d.label||"Deduction",amount:r2(Math.abs(Number(d.amount)||0))})).filter(d=>d.amount>0);
  const dedTotal=r2(deductions.reduce((s,d)=>s+d.amount,0));
  const total=r2(subtotal+service-dedTotal);
  return {subtotal,pct,service,deductions,dedTotal,total};
}
const ONES=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function w99(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"")}
function w999(n){const h=Math.floor(n/100),r=n%100;return [h?ONES[h]+" Hundred":"",r?w99(r):""].filter(Boolean).join(" ")}
function wordsIntl(n){
  if(n===0)return "Zero";
  const out=[];
  for(const [v,name] of [[1e12,"Trillion"],[1e9,"Billion"],[1e6,"Million"],[1e3,"Thousand"]]){
    if(n>=v){out.push(wordsIntl(Math.floor(n/v))+" "+name);n%=v}
  }
  if(n)out.push(w999(n));
  return out.join(" ");
}
function wordsSA(n){
  if(n===0)return "Zero";
  const out=[];
  if(n>=1e7){out.push(wordsSA(Math.floor(n/1e7))+" Crore");n%=1e7}
  if(n>=1e5){out.push(w99(Math.floor(n/1e5))+" Lakh");n%=1e5}
  if(n>=1e3){out.push(w99(Math.floor(n/1e3))+" Thousand");n%=1e3}
  if(n)out.push(w999(n));
  return out.join(" ");
}
function amountInWords(amount,cur){
  const neg=amount<0, cents=Math.round(Math.abs(amount)*100), whole=Math.floor(cents/100), frac=cents%100;
  const pre=neg?"Minus ":"";
  if(cur==="BDT")return `Taka ${pre}${wordsSA(whole)}${frac?" and Paisa "+w99(frac):""} Only`;
  return `US Dollars ${pre}${wordsIntl(whole)}${frac?" and Cents "+w99(frac):""} Only`;
}
function fmtMoney(n,cur){
  const v=Number(n)||0;
  if(cur==="BDT")return "৳"+v.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (v<0?"-$":"$")+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function invNumber(year,monthIdx,seq){return `RV/${year}/${MONTHS[monthIdx]}/${seq}`}
function nextSeq(invoices,counters,year,monthIdx){
  const key=`${year}-${String(monthIdx+1).padStart(2,"0")}`;
  let max=100;
  for(const i of invoices) if(i.year===year&&i.month===monthIdx&&i.seq>max) max=i.seq;
  const c=(counters&&counters[key])||0;
  return {key,seq:Math.max(max+1,c+1,101)};
}
function effStatus(inv,todayISO){
  if(inv.status==="paid")return "paid";
  if(inv.status==="sent")return (inv.dueDate&&inv.dueDate<todayISO)?"overdue":"sent";
  return "draft";
}

    LS.set("rv_dbx_pkce",JSON.stringify({ver,state}));
    const q=new URLSearchParams({client_id:this.appKey(),response_type:"code",code_challenge:ch,code_challenge_method:"S256",redirect_uri:this.redirect(),token_access_type:"offline",state});
    location.href="https://www.dropbox.com/oauth2/authorize?"+q.toString();
  },
  async finish(){
    const u=new URL(location.href);const code=u.searchParams.get("code"),state=u.searchParams.get("state"),er=u.searchParams.get("error");
    if(!code&&!er)return null;
    history.replaceState(null,"",location.pathname+location.hash);
    if(er)return {error:er==="access_denied"?"Dropbox access was cancelled.":"Dropbox didn't connect ("+er+")."};
    let p;try{p=JSON.parse(LS.get("rv_dbx_pkce")||"null")}catch{}
    LS.del("rv_dbx_pkce");
    if(!p||p.state!==state)return {error:"The Dropbox login didn't match. Try connecting again."};
    const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({code,grant_type:"authorization_code",code_verifier:p.ver,client_id:this.appKey(),redirect_uri:this.redirect()})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.access_token)return {error:"Dropbox didn't accept the login. Check the App key and redirect address."};
    this.saveTok({access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||14400)*1000-60000,account:j.account_id||""});
    return {ok:true};
  },
  async access(force){
    const t=this.tok();if(!t)throw new Error("notconnected");
    if(!force&&t.access&&Date.now()<t.exp)return t.access;
    const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"refresh_token",refresh_token:t.refresh,client_id:this.appKey()})});
    if(!r.ok){if(r.status===400||r.status===401){this.disconnect();throw new Error("notconnected")}const x=new Error("offline");x.detail="Dropbox login refresh failed ("+r.status+")";throw x}
    const j=await r.json();t.access=j.access_token;t.exp=Date.now()+(j.expires_in||14400)*1000-60000;this.saveTok(t);return t.access;
  },
  async call(url,opts,retry=true){
    let res;
    try{const a=await this.access();res=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+a}})}
    catch(e){if(e.message==="notconnected")throw e;const x=new Error("offline");x.detail="Network error: "+(e.message||e);throw x}
    if(res.status===401&&retry){await this.access(true);return this.call(url,opts,false)}
    return res;
  },
  async meta(){
    const r=await this.call("https://api.dropboxapi.com/2/files/get_metadata",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:DBX_PATH})});
    if(r.status===409)return null;
    if(!r.ok)throw await dbxErr(r);
    return r.json();
  },
  async download(){
    const r=await this.call("https://content.dropboxapi.com/2/files/download",{method:"POST",headers:{"Dropbox-API-Arg":JSON.stringify({path:DBX_PATH})}});
    if(r.status===409)return null;
    if(!r.ok)throw await dbxErr(r);
    let rev="";try{rev=JSON.parse(r.headers.get("Dropbox-API-Result")||"{}").rev||""}catch{}
    return {text:await r.text(),rev};
  },
  async upload(text,rev){
    const mode=rev?{".tag":"update",update:rev}:{".tag":"add"};
    const r=await this.call("https://content.dropboxapi.com/2/files/upload",{method:"POST",headers:{"Content-Type":"application/octet-stream","Dropbox-API-Arg":JSON.stringify({path:DBX_PATH,mode,autorename:false,mute:true})},body:text});
    if(r.status===409){const e=new Error("conflict");throw e}
    if(!r.ok)throw await dbxErr(r);
    return (await r.json()).rev;
  },
  disconnect(){LS.del("rv_dbx_tok")}
};
async function dbxErr(r){
  let t="";try{t=await r.text()}catch{}
  let j=null;try{j=JSON.parse(t)}catch{}
  const sum=(j&&(j.error_summary||j.error_description||(typeof j.error==="string"?j.error:"")))||t.slice(0,140);
  const e=new Error("dbx"+r.status);e.detail=`Dropbox said (${r.status}): ${sum||"no details"}`;
  e.scope=/missing_scope|required_scope/.test(t);e.status=r.status;return e;
}
function b64url(buf){return b64(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}

const ITER=310000;
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
function dataObj(){return {settings:S.settings,invoices:S.invoices,buyers:S.buyers}}
async function seal(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},K.key,te.encode(JSON.stringify(obj)));
  return JSON.stringify({app:"rightvenue-invoices",version:1,kdf:"PBKDF2-SHA256",iterations:ITER,salt:b64(K.salt),iv:b64(iv),data:b64(ct),savedAt:new Date().toISOString()});
}
async function unseal(text,pw,key){
  let f;try{f=JSON.parse(text)}catch{throw new Error("notours")}
  if(!f||f.app!=="rightvenue-invoices")throw new Error("notours");
  const salt=unb64(f.salt);const k=key||await deriveKey(pw,salt);
  let pt;try{pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(f.iv)},k,unb64(f.data))}catch{throw new Error("badpw")}
  return {key:k,salt,obj:JSON.parse(td.decode(pt))};
}
function loadObj(o){
  S.settings={...DEFAULTS,...(o.settings||{})};S.invoices=Array.isArray(o.invoices)?o.invoices:[];S.buyers=Array.isArray(o.buyers)?o.buyers:[];
}
/* tiny key-value store in the browser: remembers which data file you use (not your data in plain text) */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("rv-invoices",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvGet(k){try{const db=await idb();return await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch{return undefined}}
async function kvSet(k,v){try{const db=await idb();await new Promise(res=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=res;tx.onerror=res})}catch{}}
async function kvDel(k){try{const db=await idb();await new Promise(res=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").delete(k);tx.oncomplete=res;tx.onerror=res})}catch{}}

let saveTimer=null,saving=false,again=false;
S.saveState="saved";S.savedAt=null;
function persist(){S.saveState="pending";setSync();clearTimeout(saveTimer);saveTimer=setTimeout(flush,350)}
async function flush(force){
  if(!K.key)return;
  if(saving){again=true;return}
  saving=true;
  try{
    const text=await seal(dataObj());
    if(K.mode==="file"){
      const f=await K.handle.getFile();
      if(!force&&K.lastMod&&f.lastModified!==K.lastMod){saving=false;S.saveState="conflict";setSync();conflictModal();return}
      const w=await K.handle.createWritable();await w.write(text);await w.close();
      K.lastMod=(await K.handle.getFile()).lastModified;
    }else if(K.mode==="dropbox"){
      try{K.rev=await DBX.upload(text,force?((await DBX.meta())?.rev||null):K.rev)}
      catch(e){if(e.message==="conflict"&&!force){saving=false;S.saveState="conflict";setSync();conflictModal();return}throw e}
    }
    await kvSet("cache",text);
    S.saveState="saved";S.savedAt=new Date();
  }catch(e){S.saveState="error";console.error(e);if(e.message==="notconnected"){toast("Dropbox was disconnected. Connect again to keep saving.",true)}}
  saving=false;setSync();
  if(again){again=false;flush()}
}
window.addEventListener("online",()=>{if(S.saveState==="error")flush()});
setInterval(()=>{if(S.saveState==="error"&&K.key)flush()},30000);
function setSync(){
  const els=document.querySelectorAll("[data-sync]");if(!els.length)return;
  const where=K.mode==="dropbox"?"Dropbox":K.mode==="file"?esc(K.fileName):"this browser";
  const t=S.savedAt?S.savedAt.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"";
  const map={pending:`<span class="dot off"></span>Saving…`,saved:`<span class="dot"></span>Saved to ${where}${t?" · "+t:""}`,error:`<span class="dot bad"></span>${K.mode==="dropbox"?"Not saved yet. Waiting for internet…":"Couldn't save. Check that Dropbox is running."}`,conflict:`<span class="dot bad"></span>Data changed on another device`};
  els.forEach(el=>el.innerHTML=map[S.saveState]||map.saved);
}
function conflictModal(){
  openModal(`<div class="modal-h"><h2>Data changed on another device</h2></div><div class="modal-b"><p style="margin:0;color:var(--muted)">Your invoices were updated from another device since you opened them here. Load the newer file, or keep this computer's version and overwrite it.</p></div>
  <div class="modal-f"><button class="btn" id="cfKeep">Keep my version</button><button class="btn primary" id="cfLoad">Load the newer file</button></div>`);
  $("#cfKeep").onclick=()=>{closeModal();flush(true)};
  $("#cfLoad").onclick=async()=>{closeModal();await reloadFromFile(true)};
}
async function reloadFromFile(announce){
  try{let r;
    if(K.mode==="dropbox"){const d=await DBX.download();if(!d)throw new Error("gone");r=await unseal(d.text,null,K.key);K.rev=d.rev}
    else{const f=await K.handle.getFile();r=await unseal(await f.text(),null,K.key);K.lastMod=f.lastModified}
    loadObj(r.obj);S.saveState="saved";setSync();
    if(S.view==="editor"&&S.inv&&!S.invIsNew){const fresh=S.invoices.find(x=>x.id===S.inv.id);if(fresh)S.inv=JSON.parse(JSON.stringify(fresh));else{S.inv=null;location.hash="invoices";return}}
    render();if(announce)toast("Loaded the newer data file");}
  catch(e){if(e.message==="badpw"){toast("The data file's password was changed on another PC. Unlock again.",true);lockApp()}else toast("Couldn't read the data file",true)}
}
/* pick up changes made on another PC when you come back to this window */
const checkRemote=async()=>{
  if(!K.key||S.saveState==="pending"||saving||S.dirty)return;
  try{
    if(K.mode==="file"){const f=await K.handle.getFile();if(K.lastMod&&f.lastModified!==K.lastMod)await reloadFromFile(true)}
    else if(K.mode==="dropbox"){const m=await DBX.meta();if(m&&K.rev&&m.rev!==K.rev)await reloadFromFile(true)}
  }catch{}
};
window.addEventListener("focus",checkRemote);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkRemote()});
window.addEventListener("beforeunload",e=>{if(S.saveState==="pending"||saving||(S.view==="editor"&&S.invIsNew&&S.dirty)){e.preventDefault();e.returnValue=""}});

async function putInvoice(inv){inv.updatedAt=new Date().toISOString();const c=JSON.parse(JSON.stringify(inv));const i=S.invoices.findIndex(x=>x.id===inv.id);if(i>=0)S.invoices[i]=c;else S.invoices.push(c);persist()}
async function delInvoice(id){S.invoices=S.invoices.filter(x=>x.id!==id);persist()}
async function putBuyer(b){const c={...b,updatedAt:new Date().toISOString()};const i=S.buyers.findIndex(x=>x.id===b.id);if(i>=0)S.buyers[i]=c;else S.buyers.push(c);persist()}
async function delBuyer(id){S.buyers=S.buyers.filter(x=>x.id!==id);persist()}
async function putSettings(patch){S.settings={...S.settings,...patch};persist()}

/* ---------- lock screen ---------- */
function gate(html){$("#app").hidden=true;const g=$("#gate");g.hidden=false;g.innerHTML=`<div class="gate-card"><img class="gate-logo" src="${LOGO}" alt="rightVenue"><div class="brand-sub" style="text-align:center;margin-top:0">Invoice Studio</div>${html}</div>`}
function gateErr(m){const e=$("#gErr");if(e){e.hidden=!m;e.textContent=m||""}}
function busy(btn,txt){btn.disabled=true;btn.dataset.l=btn.innerHTML;btn.textContent=txt}
function unbusy(btn){if(!btn)return;btn.disabled=false;if(btn.dataset.l)btn.innerHTML=btn.dataset.l}
async function boot(){
  if(!window.crypto||!crypto.subtle){gate(`<h1>Open this in Chrome or Edge</h1><p class="g-p">This browser can't encrypt your data. Open the file in Google Chrome or Microsoft Edge.</p>`);return}
  const fin=await DBX.finish().catch(()=>({error:"Couldn't reach Dropbox. Check your internet and try again."}));
  if(fin?.error){showWelcome(fin.error);return}
  if(DBX.connected()){dropboxStart();return}
  const h=await kvGet("handle");
  if(h&&FS_OK){K.handle=h;K.fileName=h.name;showUnlock();return}
  const cache=await kvGet("cache"),mode=await kvGet("mode");
  if(cache&&mode==="browser"){K.mode="browser";showUnlock();return}
  showWelcome();
}
function showWelcome(msg){
  K.mode=null;
  gate(`<h1>Welcome</h1>
  <p class="g-p">Your invoices are kept in one encrypted data file in <b>your Dropbox</b>, so they're the same on your iPhone, Mac and Windows PC.</p>
  <div class="g-actions"><button class="btn primary g-big" id="gDbx"><svg><use href="#i-box"/></svg>Connect Dropbox</button>
  ${FS_OK?`<button class="btn ghost" id="gLocal">Use a data file on this computer instead</button>`:""}</div>
  <div class="err" id="gErr" hidden></div>`);
  if(msg)gateErr(msg);
  $("#gDbx").addEventListener("click",()=>{if(!DBX.appKey())showDbxKey();else DBX.begin()});
  $("#gLocal")?.addEventListener("click",showLocalChoice);
}
function showDbxKey(){
  const uri=DBX.redirect();
  gate(`<h1>One-time Dropbox setup</h1>
  <p class="g-p">Paste the <b>App key</b> from your Dropbox app's Settings page.</p>
  <form id="gForm" class="stack">
    <label class="f"><span>Dropbox App key</span><input class="inp" id="gKey" autocomplete="off" autocapitalize="off" spellcheck="false" required value="${esc(LS.get("rv_dbx_key")||"")}"></label>
    <div class="steps-box">In the same Settings page, under <b>Redirect URIs</b>, add this address exactly:<div class="uri"><code id="gUri">${esc(uri)}</code><button type="button" class="btn sm" id="gCopy">${icon("copy")}Copy</button></div></div>
    <div class="err" id="gErr" hidden></div>
    <button class="btn primary g-big">Save and connect Dropbox</button>
    <button type="button" class="btn ghost" id="gBack">Back</button>
  </form>`);
  $("#gBack").onclick=()=>showWelcome();
  $("#gCopy").onclick=async()=>{try{await navigator.clipboard.writeText(uri);toast("Address copied")}catch{const r=document.createRange();r.selectNodeContents($("#gUri"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("Selected. Copy it now")}};
  $("#gForm").addEventListener("submit",e=>{e.preventDefault();const k=$("#gKey").value.trim();if(!/^[a-z0-9]{8,32}$/i.test(k))return gateErr("That doesn't look like an App key. It's a short code of letters and numbers.");LS.set("rv_dbx_key",k);DBX.begin()});
}
async function dropboxStart(){
  K.mode="dropbox";K.handle=null;
  gate(`<h1>Opening…</h1><p class="g-p">Checking your Dropbox.</p>`);
  try{const m=await DBX.meta();if(m)showUnlock();else showDbxSetup()}
  catch(e){
    if(e.message==="notconnected"){showWelcome("Dropbox needs to be connected again.");return}
    const scope=e.scope||e.status===401;
    gate(scope?`<h1>Dropbox permissions needed</h1><p class="g-p">Your Dropbox app is missing a permission. In the Dropbox developer site, open your app's <b>Permissions</b> tab, tick <b>files.metadata.read</b>, <b>files.content.read</b> and <b>files.content.write</b>, click <b>Submit</b>, then connect again here.</p><button class="btn primary g-big" id="gRe">Connect Dropbox again</button>`
      :`<h1>Can't reach Dropbox</h1><p class="g-p">${e.message==="offline"?"Check your internet connection, then try again.":"Dropbox refused the request."}</p>`)
    $("#gate .gate-card").insertAdjacentHTML("beforeend",`${e.detail?`<div class="steps-box" style="word-break:break-word"><b>Details</b><div style="margin-top:4px;color:var(--muted)">${esc(e.detail)}</div></div>`:""}${scope?"":`<button class="btn primary g-big" id="gRetry">Try again</button>`}<button class="btn ghost" id="gDisc">Disconnect and connect again</button>`);
    $("#gRetry")?.addEventListener("click",dropboxStart);
    $("#gRe")?.addEventListener("click",()=>{DBX.disconnect();DBX.begin()});
    $("#gDisc").onclick=()=>{DBX.disconnect();showWelcome()};
  }
}
function showDbxSetup(){
  gate(`<h1>Dropbox connected</h1>
  <p class="g-p">There's no invoice data in your Dropbox yet. Do you already have a data file from the computer version?</p>
  <div class="g-actions">
    <button class="btn primary g-big" id="gImport">${icon("file")}Yes, move my data file into Dropbox</button>
    <button class="btn g-big" id="gFresh">${icon("plus")}No, start fresh</button>
    <input type="file" id="gFile" accept=".json,application/json" hidden>
  </div>
  <div class="err" id="gErr" hidden></div>`);
  $("#gFresh").onclick=()=>{K.mode="dropbox";showCreate()};
  $("#gImport").onclick=()=>$("#gFile").click();
  $("#gFile").addEventListener("change",async e=>{
    const f=e.target.files[0];if(!f)return;const text=await f.text();
    let ok=false;try{ok=JSON.parse(text).app==="rightvenue-invoices"}catch{}
    if(!ok)return gateErr("That isn't a rightVenue data file. Pick rightvenue-invoices-data.json.");
    K.importText=text;showUnlock();
  });
}
function showLocalChoice(){
  gate(`<h1>Data file on this computer</h1>
  <p class="g-p">Works in Chrome or Edge on a computer. Your iPhone can't use this option.</p>
  <div class="g-actions"><button class="btn primary g-big" id="gNew">${icon("plus")}Create a new data file</button><button class="btn g-big" id="gOpen">${icon("file")}Open my existing data file</button><button class="btn ghost" id="gBack">Back</button></div>
  <div class="err" id="gErr" hidden></div>`);
  $("#gBack").onclick=()=>showWelcome();
  $("#gNew").addEventListener("click",()=>{K.mode="file";showCreate()});
  $("#gOpen").addEventListener("click",async()=>{
    try{const [h]=await showOpenFilePicker({types:[{description:"rightVenue data file",accept:{"application/json":[".json"]}}],multiple:false});K.handle=h;K.fileName=h.name;K.mode="file";showUnlock(true)}
    catch(e){if(e.name!=="AbortError")gateErr("Couldn't open that file.")}
  });
}
function showCreate(){
  gate(`<h1>Set your app password</h1>
  <p class="g-p">Your data file is encrypted with this password. Nobody can read your invoices without it, including anyone with access to your Dropbox.</p>
  <form id="gForm" class="stack">
    <label class="f"><span>Password (at least 8 characters)</span><input class="inp" id="gPw" type="password" autocomplete="new-password" required minlength="8"></label>
    <label class="f"><span>Type it again</span><input class="inp" id="gPw2" type="password" autocomplete="new-password" required></label>
    <div class="banner" style="margin:0">${icon("info")}<div>Write this password down somewhere safe. If you forget it, the invoices can't be recovered.</div></div>
    <div class="err" id="gErr" hidden></div>
    <button class="btn primary g-big" id="gGo">${K.mode==="file"?"Choose where to save the data file":"Create and open"}</button>
    <button type="button" class="btn ghost" id="gBack">Back</button>
  </form>`);
  $("#gBack").onclick=()=>K.mode==="dropbox"?showDbxSetup():K.mode==="file"?showLocalChoice():showWelcome();
  $("#gPw").focus();
  $("#gForm").addEventListener("submit",async e=>{
    e.preventDefault();const pw=$("#gPw").value;
    if(pw.length<8)return gateErr("Use at least 8 characters.");
    if(pw!==$("#gPw2").value)return gateErr("The two passwords don't match.");
    const btn=$("#gGo");
    try{
      if(K.mode==="file"){
        const h=await showSaveFilePicker({suggestedName:"rightvenue-invoices-data.json",types:[{description:"rightVenue data file",accept:{"application/json":[".json"]}}]});
        K.handle=h;K.fileName=h.name;K.mode="file";
      }
      busy(btn,"Securing your data…");
      K.salt=crypto.getRandomValues(new Uint8Array(16));K.key=await deriveKey(pw,K.salt);
      loadObj({});
      if(K.mode==="dropbox"){K.rev=await DBX.upload(await seal(dataObj()),null)}
      if(K.mode==="file"){const w=await K.handle.createWritable();await w.write(await seal(dataObj()));await w.close();K.lastMod=(await K.handle.getFile()).lastModified;await kvSet("handle",K.handle)}
      await kvSet("cache",await seal(dataObj()));await kvSet("mode",K.mode);
      S.savedAt=new Date();enterApp(true);
    }catch(err){unbusy(btn);if(err.name!=="AbortError")gateErr(K.mode==="dropbox"?(err.message==="conflict"?"A data file already exists in your Dropbox. Go back and unlock it instead.":"Couldn't save to Dropbox. Check your internet and try again."):"Couldn't create the data file. Try a different folder.")}
  });
}
function showUnlock(fresh){
  gate(`<h1>Unlock</h1>
  <p class="g-p">${K.importText?"Enter the password of the data file you're moving into Dropbox.":K.mode==="dropbox"?"Your invoices are in your Dropbox.":K.mode==="browser"?"Your invoices are stored in this browser.":`Data file: <b>${esc(K.fileName)}</b>`}</p>
  <form id="gForm" class="stack">
    <label class="f"><span>App password</span><input class="inp" id="gPw" type="password" autocomplete="current-password" required></label>
    <div class="err" id="gErr" hidden></div>
    <button class="btn primary g-big" id="gGo">Unlock</button>
    ${K.mode==="dropbox"?`<button type="button" class="btn ghost" id="gOther">${K.importText?"Back":"Disconnect Dropbox"}</button>`:FS_OK?`<button type="button" class="btn ghost" id="gOther">Use a different data file</button>`:""}
  </form>`);
  $("#gPw").focus();
  $("#gOther")?.addEventListener("click",()=>{if(K.mode==="dropbox"){if(K.importText){K.importText=null;showDbxSetup()}else{DBX.disconnect();showWelcome()}return}K.handle=null;K.mode=null;showWelcome()});
  $("#gForm").addEventListener("submit",async e=>{
    e.preventDefault();const pw=$("#gPw").value,btn=$("#gGo");
    try{
      let text;
      if(K.mode==="dropbox"){
        busy(btn,"Unlocking…");
        if(K.importText){text=K.importText}else{const d=await DBX.download();if(!d){unbusy(btn);showDbxSetup();return}text=d.text;K.rev=d.rev}
      }else if(K.handle){
        K.mode="file";
        const p=await K.handle.queryPermission({mode:"readwrite"});
        if(p!=="granted"){const q=await K.handle.requestPermission({mode:"readwrite"});if(q!=="granted")return gateErr("Allow access to the data file to continue.")}
        busy(btn,"Unlocking…");
        const f=await K.handle.getFile();text=await f.text();K.lastMod=f.lastModified;
      }else{busy(btn,"Unlocking…");text=await kvGet("cache")}
      const r=await unseal(text,pw);K.key=r.key;K.salt=r.salt;loadObj(r.obj);
      if(K.mode==="dropbox"&&K.importText){K.rev=await DBX.upload(text,null);K.importText=null;toast("Your data file is now in Dropbox")}
      if(K.mode==="file")await kvSet("handle",K.handle);
      await kvSet("cache",text);await kvSet("mode",K.mode);
      enterApp(fresh);
    }catch(err){unbusy(btn);
      gateErr(err.message==="badpw"?"Wrong password. Try again.":err.message==="notconnected"?"Dropbox needs to be connected again.":err.message==="offline"||String(err.message).startsWith("dbx")?("Couldn't reach Dropbox. "+(err.detail||"Check your internet and try again.")):err.message==="conflict"?"A data file already exists in your Dropbox.":err.message==="notours"?"That file isn't a rightVenue data file.":err.name==="NotFoundError"?"The data file wasn't found. It may have been moved or renamed in Dropbox. Use a different data file.":"Couldn't open the data file. Check that Dropbox is running.");
      $("#gPw").select();}
  });
}

/* auto-lock after 15 minutes without use */
const IDLE_MS=15*60*1000;let lastActive=Date.now();
["pointerdown","keydown","touchstart","wheel"].forEach(ev=>document.addEventListener(ev,()=>{lastActive=Date.now()},{passive:true,capture:true}));
function idleCheck(){
  if(!K.key||Date.now()-lastActive<IDLE_MS)return;
  if(S.saveState==="pending"||saving){setTimeout(idleCheck,1500);return}
  if(S.view==="editor"&&S.invIsNew&&S.dirty&&S.inv?.buyer?.name?.trim()){saveNew().then(()=>{if(!S.invIsNew)setTimeout(idleCheck,1500)});return}
  S.dirty=false;S.invIsNew=false;lockApp();toast("Locked after 15 minutes without use");
}
setInterval(idleCheck,30000);

async function changePassword(){
  openModal(`<div class="modal-h"><h2>Change password</h2><button class="btn ghost icon" data-close aria-label="Close">${icon("x")}</button></div>
  <form id="pwForm"><div class="modal-b">
    <label class="f"><span>Current password</span><input class="inp" id="p0" type="password" autocomplete="current-password" required></label>
    <label class="f"><span>New password (at least 8 characters)</span><input class="inp" id="p1" type="password" autocomplete="new-password" required minlength="8"></label>
    <label class="f"><span>Type the new password again</span><input class="inp" id="p2" type="password" autocomplete="new-password" required></label>
    <div class="err" id="pErr" hidden></div></div>
  <div class="modal-f"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" id="pGo">Change password</button></div></form>`);
  $("#pwForm").addEventListener("submit",async e=>{
    e.preventDefault();const err=m=>{$("#pErr").hidden=false;$("#pErr").textContent=m};
    const p0=$("#p0").value,p1=$("#p1").value;
    if(p1.length<8)return err("Use at least 8 characters.");
    if(p1!==$("#p2").value)return err("The new passwords don't match.");
    const btn=$("#pGo");busy(btn,"Changing…");
    try{const test=await deriveKey(p0,K.salt);
      const probe=JSON.parse(await seal({}));try{await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(probe.iv)},test,unb64(probe.data))}catch{unbusy(btn);return err("The current password is wrong.")}
      K.salt=crypto.getRandomValues(new Uint8Array(16));K.key=await deriveKey(p1,K.salt);await flush(true);closeModal();toast("Password changed")}
    catch{unbusy(btn);err("Couldn't change the password. Try again.")}
  });
}

}

function route(){

  <div class="page-head"><div><h1>Dashboard</h1><p>${new Date(t+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p></div>

  </div>

    </div>

      <div class="card-pad sec-h" style="padding-bottom:8px"><h2>Recent invoices</h2><a href="#invoices" class="btn ghost sm">View all</a></div>

function newInvoice(buyerId){
  const s=S.settings,t=todayISO();
  const b=buyerId?S.buyers.find(x=>x.id===buyerId):null;
  S.inv={id:uid("inv"),number:"",seq:0,year:0,month:0,issueDate:t,dueDate:addDays(t,s.dueDays??7),currency:s.currency||"USD",
    buyerId:b?.id||"",buyer:b?{name:b.name,company:b.company||"",email:b.email||"",country:b.country||"",address:b.address||""}:{name:"",company:"",email:"",country:"",address:""},
    items:[{desc:"",qty:1,rate:""}],serviceChargePct:Number(s.serviceChargePct)||0,deductions:[],notes:s.notes||"",payoneerLink:s.payoneerLink||"",
    status:"draft",paidDate:"",sentAt:"",createdAt:""};
  S.invIsNew=true;S.dirty=false;S.tab="form";
}
function previewNumber(inv){
  if(inv.number)return inv.number;
  const d=new Date((inv.issueDate||todayISO())+"T00:00:00");
  const {seq}=nextSeq(S.invoices,S.settings.counters,d.getFullYear(),d.getMonth());
  return invNumber(d.getFullYear(),d.getMonth(),seq);
}
function viewEditor(){
  const inv=S.inv;
  return `${offlineBanner()}
  <div class="ed-bar" id="edBar"></div>
  <div class="seg mob-tabs" role="tablist" ${S.preview?"":"hidden"}><button data-tab="form" aria-pressed="${S.tab==="form"}">Edit</button><button data-tab="preview" aria-pressed="${S.tab==="preview"}">Preview</button></div>
  <div class="editor" data-tab="${S.tab}" data-preview="${S.preview?"on":"off"}">
    <div class="form-col card" id="edForm">
      <div class="sec">
        <div class="sec-h"><h3>Bill to</h3></div>
        <label class="f"><span>Saved buyer</span><select class="inp" id="e_buyer"><option value="">— Type details below or choose —</option>${[...S.buyers].sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(b=>`<option value="${b.id}" ${inv.buyerId===b.id?"selected":""}>${esc(b.name)}${b.company?" · "+esc(b.company):""}</option>`).join("")}</select></label>
        <div class="grid2"><label class="f"><span>Name</span><input class="inp" id="e_bname" value="${esc(inv.buyer.name)}"></label><label class="f"><span>Company</span><input class="inp" id="e_bco" value="${esc(inv.buyer.company)}"></label></div>
        <div class="grid2"><label class="f"><span>Email</span><input class="inp" id="e_bemail" type="email" value="${esc(inv.buyer.email)}"></label><label class="f"><span>Country</span><input class="inp" id="e_bcountry" value="${esc(inv.buyer.country)}"></label></div>
        <label class="f"><span>Address</span><textarea class="inp" id="e_baddr" rows="2" style="min-height:56px">${esc(inv.buyer.address)}</textarea></label>
        <div class="row"><button type="button" class="btn" id="saveBuyerBtn"></button><span class="hint" id="buyerHint"></span></div>
      </div>
      <div class="sec">
        <div class="sec-h"><h3>Details</h3><div class="seg" role="group" aria-label="Currency"><button type="button" data-cur="USD" aria-pressed="${inv.currency==="USD"}">USD $</button><button type="button" data-cur="BDT" aria-pressed="${inv.currency==="BDT"}">BDT ৳</button></div></div>
        <div class="grid2"><label class="f"><span>Issue date</span><input class="inp" id="e_issue" type="date" value="${esc(inv.issueDate)}"></label><label class="f"><span>Due date</span><input class="inp" id="e_due" type="date" value="${esc(inv.dueDate)}"></label></div>
      </div>
      <div class="sec">
        <div class="sec-h"><h3>Work items</h3></div>
        <div class="items" id="itemsBox"></div>
        <button type="button" class="add-link" id="addItem">${icon("plus")}Add item</button>
      </div>
      <div class="sec">
        <div class="sec-h"><h3>Charges & deductions</h3></div>
        <label class="f" style="max-width:200px"><span>Service charge</span><div class="affix"><input class="inp num" id="e_sc" type="number" min="0" step="0.01" value="${esc(inv.serviceChargePct)}"><b>%</b></div></label>
        <div class="stack" id="dedBox"></div>
        <button type="button" class="add-link red" id="addDed">${icon("minus")}Add deduction (discount, loan payback…)</button>
        <div class="totals-mini" id="miniTotals"></div>
      </div>
      <div class="sec">
        <div class="sec-h"><h3>Payment & notes</h3></div>
        <label class="f"><span>Payoneer payment link</span><input class="inp" id="e_link" type="url" placeholder="https://link.payoneer.com/…" value="${esc(inv.payoneerLink)}"></label>
        <div class="hint">Shows a Pay button and a Scan to Pay QR code on the invoice. Leave empty to hide them.</div>
        <label class="f"><span>Note</span><textarea class="inp" id="e_notes" rows="3">${esc(inv.notes)}</textarea></label>
      </div>
    </div>
    <div class="preview-col">
      <div class="preview-frame"><div class="preview-meta"><span>Live preview on your pad</span><span id="pvCount"></span></div><div id="pvPages" class="stack" style="gap:14px"></div></div>
