}
function renderEditorBar(){
  const bar=$("#edBar");if(!bar||!S.inv)return;
  const inv=S.inv,st=effStatus(inv,todayISO());
  bar.innerHTML=`<div class="title"><a href="#invoices" class="btn ghost icon" aria-label="Back to invoices">${icon("back")}</a><h1>${esc(previewNumber(inv))}</h1>${S.invIsNew?`<span class="pill draft">New</span>`:pill(st)}<span class="save-state" id="saveState">${S.invIsNew?"Not saved yet":S.dirty?"Saving…":"All changes saved"}</span></div>
  <div class="row">
    ${S.invIsNew?`<button class="btn primary" id="btnSave">${icon("check")}Save invoice</button>`:""}
    <button class="btn" id="btnPv" aria-pressed="${S.preview}" title="Show or hide the invoice preview">${icon(S.preview?"eye":"eye-off")}Preview ${S.preview?"on":"off"}</button>
    <button class="btn" id="btnPdf">${icon("dl")}PDF</button>
    <button class="btn ${S.invIsNew?"":"primary"}" id="btnEmail">${icon("mail")}Email</button>
    ${!S.invIsNew&&st!=="paid"?`<button class="btn" id="btnPaid">${icon("check")}Mark paid</button>`:""}
    <div class="menu"><button class="btn icon" id="btnMore" aria-label="More actions" aria-expanded="false">${icon("more")}</button><div class="menu-pop" id="morePop" hidden>
      ${!S.invIsNew&&st==="draft"?`<button data-act="sent">${icon("mail")}Mark as sent</button>`:""}
      ${!S.invIsNew&&st==="paid"?`<button data-act="unpaid">${icon("undo")}Mark as unpaid</button>`:""}
      <button data-act="dup">${icon("copy")}Duplicate</button>
      ${S.invIsNew?"":`<button data-act="del" class="dz">${icon("trash")}Delete invoice</button>`}
    </div></div>
  </div>`;
  $("#btnSave")?.addEventListener("click",saveNew);
  $("#btnPdf")?.addEventListener("click",downloadPdf);
  $("#btnPv")?.addEventListener("click",togglePreview);
  $("#btnEmail").addEventListener("click",emailModal);
  $("#btnPaid")?.addEventListener("click",()=>setStatus("paid"));
  const pop=$("#morePop");
  $("#btnMore").addEventListener("click",e=>{e.stopPropagation();pop.hidden=!pop.hidden;$("#btnMore").setAttribute("aria-expanded",String(!pop.hidden))});
  pop.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;pop.hidden=true;
    const a=b.dataset.act;
    if(a==="sent")setStatus("sent");
    if(a==="unpaid")setStatus("sent");
    if(a==="dup")duplicate();
    if(a==="del")confirmModal(`Delete ${inv.number}?`,"This invoice will be removed for good. Its number won't be reused.","Delete invoice",async()=>{await delInvoice(inv.id);S.inv=null;toast("Invoice deleted");location.hash="invoices"});
  });
}
document.addEventListener("click",()=>{const p=$("#morePop");if(p&&!p.hidden){p.hidden=true}});

function bindEditor(){
  renderEditorBar();renderItems();renderDeds();renderMini();
  const inv=S.inv;
  const on=(id,fn,ev="input")=>$("#"+id).addEventListener(ev,fn);
  const bf={e_bname:"name",e_bco:"company",e_bemail:"email",e_bcountry:"country",e_baddr:"address"};
  Object.entries(bf).forEach(([id,k])=>on(id,e=>{inv.buyer[k]=e.target.value;updateBuyerBtn();changed()}));
  on("e_buyer",e=>{const b=S.buyers.find(x=>x.id===e.target.value);inv.buyerId=b?.id||"";
    if(b){inv.buyer={name:b.name||"",company:b.company||"",email:b.email||"",country:b.country||"",address:b.address||""};
      $("#e_bname").value=inv.buyer.name;$("#e_bco").value=inv.buyer.company;$("#e_bemail").value=inv.buyer.email;$("#e_bcountry").value=inv.buyer.country;$("#e_baddr").value=inv.buyer.address}
    updateBuyerBtn();changed()},"change");
  on("e_issue",e=>{inv.issueDate=e.target.value;if(S.invIsNew)renderEditorBar();changed()});
  on("e_due",e=>{inv.dueDate=e.target.value;changed()});
  on("e_sc",e=>{inv.serviceChargePct=e.target.value===""?0:Number(e.target.value);renderMini();changed()});
  on("e_link",e=>{inv.payoneerLink=e.target.value.trim();changed()});
  on("e_notes",e=>{inv.notes=e.target.value;changed()});
  document.querySelectorAll("[data-cur]").forEach(b=>b.addEventListener("click",()=>{inv.currency=b.dataset.cur;document.querySelectorAll("[data-cur]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderItems();renderDeds();renderMini();changed()}));
  document.querySelectorAll(".mob-tabs [data-tab]").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;document.querySelectorAll(".mob-tabs [data-tab]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$(".editor").dataset.tab=S.tab;if(S.tab==="preview")updatePreview()}));
  on("addItem",()=>{inv.items.push({desc:"",qty:1,rate:""});renderItems();changed();const all=document.querySelectorAll("#itemsBox textarea");all[all.length-1]?.focus()},"click");
  on("addDed",()=>{inv.deductions.push({label:"Discount",amount:""});renderDeds();changed();const all=document.querySelectorAll("#dedBox .ded-amt");all[all.length-1]?.focus()},"click");
  updateBuyerBtn();
  on("saveBuyerBtn",async()=>{
    const b=inv.buyer;if(!b.name.trim()){toast("Enter the buyer's name first",true);$("#e_bname").focus();return}
    const existing=inv.buyerId&&S.buyers.find(x=>x.id===inv.buyerId);
    const nb={id:existing?existing.id:uid("buy"),name:b.name.trim(),company:b.company.trim(),email:b.email.trim(),country:b.country.trim(),address:b.address.trim()};
    try{await putBuyer(nb);inv.buyerId=nb.id;changed();toast(existing?"Buyer updated":"Buyer saved");
      const sel=$("#e_buyer");if(sel&&!existing){const o=document.createElement("option");o.value=nb.id;o.textContent=nb.name+(nb.company?" · "+nb.company:"");sel.append(o)}if(sel)sel.value=nb.id;updateBuyerBtn()}
    catch{toast("Couldn't save the buyer",true)}
  },"click");
}
function updateBuyerBtn(){
  const btn=$("#saveBuyerBtn"),hint=$("#buyerHint");if(!btn||!S.inv)return;
  const b=S.inv.buyer,ex=S.inv.buyerId&&S.buyers.find(x=>x.id===S.inv.buyerId);
  const same=ex&&["name","company","email","country","address"].every(k=>(ex[k]||"").trim()===(b[k]||"").trim());
  if(!ex){btn.innerHTML=`${icon("users")}Save buyer`;btn.disabled=false;hint.textContent="Keep these details for future invoices";}
  else if(same){btn.innerHTML=`${icon("check")}Buyer saved`;btn.disabled=true;hint.textContent="";}
  else{btn.innerHTML=`${icon("users")}Update saved buyer`;btn.disabled=false;hint.textContent="You changed this buyer's details";}
}
function renderItems(){
  const inv=S.inv,box=$("#itemsBox");if(!box)return;
  box.innerHTML=inv.items.map((it,i)=>`<div class="item" data-i="${i}">
    <label class="f"><span>Description</span><textarea class="inp" rows="1" data-k="desc" placeholder="e.g. Logo design, 3 concepts">${esc(it.desc)}</textarea></label>
    <label class="f"><span>Qty</span><input class="inp num" type="number" min="0" step="any" data-k="qty" value="${esc(it.qty)}"></label>
    <label class="f"><span>Rate</span><input class="inp num" type="number" min="0" step="0.01" data-k="rate" value="${esc(it.rate)}" placeholder="0.00"></label>
    <button type="button" class="btn ghost sm icon" style="margin-top:22px" data-rm aria-label="Remove item" ${inv.items.length<2?"disabled":""}>${icon("x")}</button>
    <div class="amt"><span>Amount</span><b data-amt>${fmtMoney(r2((Number(it.qty)||0)*(Number(it.rate)||0)),inv.currency)}</b></div>
  </div>`).join("");
  box.querySelectorAll(".item").forEach(row=>{
    const i=Number(row.dataset.i);
    row.querySelectorAll("[data-k]").forEach(el=>{
      if(el.tagName==="TEXTAREA")autoGrow(el);
      el.addEventListener("input",()=>{const k=el.dataset.k;inv.items[i][k]=k==="desc"?el.value:el.value;if(el.tagName==="TEXTAREA")autoGrow(el);
        row.querySelector("[data-amt]").textContent=fmtMoney(r2((Number(inv.items[i].qty)||0)*(Number(inv.items[i].rate)||0)),inv.currency);renderMini();changed()})});
    row.querySelector("[data-rm]").addEventListener("click",()=>{inv.items.splice(i,1);renderItems();renderMini();changed()});
  });
}
function autoGrow(el){el.style.height="38px";el.style.height=Math.max(38,el.scrollHeight+2)+"px"}
function renderDeds(){
  const inv=S.inv,box=$("#dedBox");if(!box)return;
  box.innerHTML=inv.deductions.map((d,i)=>`<div class="ded" data-i="${i}"><input class="inp" data-k="label" value="${esc(d.label)}" placeholder="Discount" aria-label="Deduction label"><div class="affix"><input class="inp num neg ded-amt" type="number" min="0" step="0.01" data-k="amount" value="${esc(d.amount)}" placeholder="0.00" aria-label="Deduction amount" style="padding-right:38px"><b>${inv.currency==="BDT"?"৳":"$"}</b></div><button type="button" class="btn ghost sm icon" data-rm aria-label="Remove deduction">${icon("x")}</button></div>`).join("");
  box.querySelectorAll(".ded").forEach(row=>{const i=Number(row.dataset.i);
    row.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("input",()=>{inv.deductions[i][el.dataset.k]=el.value;renderMini();changed()}));
    row.querySelector("[data-rm]").addEventListener("click",()=>{inv.deductions.splice(i,1);renderDeds();renderMini();changed()})});
}
function renderMini(){
  const el=$("#miniTotals");if(!el)return;const inv=S.inv,c=calc(inv),cur=inv.currency;
  el.innerHTML=`<div><span>Subtotal</span><span class="num">${fmtMoney(c.subtotal,cur)}</span></div>
  ${c.pct?`<div><span>Service charge (${c.pct}%)</span><span class="num">+ ${fmtMoney(c.service,cur)}</span></div>`:""}
  ${c.deductions.map(d=>`<div class="neg"><span>${esc(d.label)}</span><span class="num">− ${fmtMoney(d.amount,cur)}</span></div>`).join("")}
  <div class="big"><span>Total</span><span class="num">${fmtMoney(c.total,cur)}</span></div>
  <div class="words">${esc(amountInWords(c.total,cur))}</div>`;
}

let saveT=null,pvT=null;
function changed(){
  S.dirty=true;
  clearTimeout(pvT);pvT=setTimeout(updatePreview,160);
  if(!S.invIsNew){const ss=$("#saveState");if(ss)ss.textContent="Saving…";clearTimeout(saveT);saveT=setTimeout(autoSave,700)}
}
async function autoSave(){
  try{await putInvoice(S.inv);S.dirty=false;const ss=$("#saveState");if(ss)ss.textContent="All changes saved"}
  catch(e){const ss=$("#saveState");if(ss)ss.textContent="Not saved, check connection";toast("Couldn't save changes",true)}
}
async function saveNew(){
  const inv=S.inv;
  if(!inv.buyer.name.trim()){toast("Add the buyer's name before saving",true);S.tab="form";render();$("#e_bname")?.focus();return}
  const d=new Date((inv.issueDate||todayISO())+"T00:00:00");
  const y=d.getFullYear(),m=d.getMonth();const {key,seq}=nextSeq(S.invoices,S.settings.counters,y,m);
  inv.year=y;inv.month=m;inv.seq=seq;inv.number=invNumber(y,m,seq);inv.createdAt=new Date().toISOString();
  try{
    await putInvoice(inv);
    await putSettings({counters:{...(S.settings.counters||{}),[key]:seq}});
    S.invIsNew=false;S.dirty=false;toast(`Saved ${inv.number}`);render();
  }catch(e){inv.number="";inv.seq=0;toast("Couldn't save the invoice. Check your connection and try again.",true)}
}
async function ensureSaved(){
  if(S.invIsNew){await saveNew();return !S.invIsNew}
  if(S.dirty){clearTimeout(saveT);await autoSave()}
  return true;
}
async function setStatus(st){
  const inv=S.inv;inv.status=st;
  if(st==="paid")inv.paidDate=todayISO();else inv.paidDate="";
  if(st==="sent"&&!inv.sentAt)inv.sentAt=new Date().toISOString();
  try{await putInvoice(inv);toast(st==="paid"?`${inv.number} marked as paid`:`${inv.number} marked as sent`);renderEditorBar();updatePreview()}catch{toast("Couldn't update the status",true)}
}
function duplicate(){
  const src=S.inv;const t=todayISO();
  const copy=JSON.parse(JSON.stringify(src));
  Object.assign(copy,{id:uid("inv"),number:"",seq:0,year:0,month:0,issueDate:t,dueDate:addDays(t,S.settings.dueDays??7),status:"draft",paidDate:"",sentAt:"",createdAt:""});
  S.inv=copy;S.invIsNew=true;S.dirty=true;render();toast("Copy ready. Save it to give it a number.");
}

/* ---------- invoice paper ---------- */
function qrDataUrl(text){
  try{if(!window.qrcode||!text)return "";const q=qrcode(0,"M");q.addData(text);q.make();return q.createDataURL(6,0)}catch{return ""}
}
function paperShell(){
  const p=document.createElement("div");p.className="paper";
  p.innerHTML=`<img class="pad" src="${PAD}" alt=""><div class="zone"></div><div class="pfoot"><span class="pg"></span><span>This is a computer-generated invoice and requires no signature.</span></div>`;
  return p;
}
function buildPages(inv,host){
  host.innerHTML="";
  const c=calc(inv),cur=inv.currency,number=previewNumber(inv),st=effStatus(inv,todayISO());
  const pages=[];
  const newPage=cont=>{const p=paperShell();host.append(p);pages.push(p);const z=p.querySelector(".zone");if(cont){const h=document.createElement("div");h.className="p-cont";h.textContent=`Invoice ${number}, continued`;z.append(h)}return z};
  const over=z=>z.scrollHeight>z.clientHeight+1;
  const el=html=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild};
  let zone=newPage(false);
  const b=inv.buyer||{};
  zone.append(el(`<div class="p-head"><div><div class="p-title">INVOICE</div><div class="p-title-bar"><i style="background:#ec1d25"></i><i style="background:#f4bb24"></i><i style="background:#096f3d"></i></div></div>
    <dl class="p-meta"><dt>Invoice No.</dt><dd>${esc(number)}</dd><dt>Issue date</dt><dd>${fmtDate(inv.issueDate)}</dd><dt>Due date</dt><dd>${fmtDate(inv.dueDate)}</dd><dt>Currency</dt><dd>${cur==="BDT"?"BDT (৳)":"USD ($)"}</dd></dl></div>`));
  zone.append(el(`<div class="p-parties"><div class="p-bill"><div class="p-lbl">Billed to</div><div class="nm">${esc(b.name||"Buyer name")}</div>${b.company?`<div class="ln">${esc(b.company)}</div>`:""}${b.address?`<div class="ln">${esc(b.address)}</div>`:""}${b.country?`<div class="ln">${esc(b.country)}</div>`:""}${b.email?`<div class="ln">${esc(b.email)}</div>`:""}</div>
    <div class="p-due">${st==="paid"?`<div class="p-stamp">PAID</div>`:""}<div class="p-lbl">${st==="paid"?"Amount paid":"Amount due"}</div><div class="amt">${fmtMoney(c.total,cur)}</div><div class="by">${st==="paid"?`Paid on ${fmtDate(inv.paidDate)}`:`Due by ${fmtDate(inv.dueDate)}`}</div></div></div>`));
  const tableHead=`<table class="p-tbl"><thead><tr><th class="ix">#</th><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr><tr class="goldline"><th colspan="5"></th></tr></thead><tbody></tbody></table>`;
  let tbl=el(tableHead);zone.append(tbl);
  const items=(inv.items||[]).filter(it=>String(it.desc).trim()||Number(it.rate));
  const rows=items.length?items:[{desc:"Describe the work here",qty:1,rate:0,_ph:true}];
  rows.forEach((it,i)=>{
    const tr=el(`<table><tbody><tr class="${i%2?"alt":""}"><td class="ix">${i+1}</td><td class="d" ${it._ph?'style="color:#9a9596"':""}>${esc(it.desc)}</td><td class="r">${esc(Number(it.qty)||0)}</td><td class="r">${fmtMoney(it.rate,cur)}</td><td class="r"><b>${fmtMoney(r2((Number(it.qty)||0)*(Number(it.rate)||0)),cur)}</b></td></tr></tbody></table>`).querySelector("tr");
    tbl.tBodies[0].append(tr);
    if(over(zone)&&tbl.tBodies[0].rows.length>1){tr.remove();zone=newPage(true);tbl=el(tableHead);zone.append(tbl);tbl.tBodies[0].append(tr)}
  });
  const blocks=[];
  blocks.push(`<div class="p-sum"><div class="p-words"><div class="p-lbl">Amount in words</div><div class="t">${esc(amountInWords(c.total,cur))}</div></div>
    <div class="p-totals"><div><span>Subtotal</span><span>${fmtMoney(c.subtotal,cur)}</span></div>
    ${c.pct?`<div><span>Service charge (${c.pct}%)</span><span>+ ${fmtMoney(c.service,cur)}</span></div>`:""}
    ${c.deductions.map(d=>`<div class="neg"><span>${esc(d.label)}</span><span>− ${fmtMoney(d.amount,cur)}</span></div>`).join("")}
    <div class="tot"><span>${st==="paid"?"Total paid":"Total due"}</span><span>${fmtMoney(c.total,cur)}</span></div></div></div>`);
  const link=inv.payoneerLink;
  if(link&&st!=="paid"){const qr=qrDataUrl(link);
    blocks.push(`<div class="p-pay"><div class="txt"><div class="h">Pay securely with Payoneer</div><div class="s">Click the button or scan the code with your phone. Cards and bank transfers accepted through Payoneer.</div><a class="p-paybtn" data-paylink href="${esc(link)}">Pay ${fmtMoney(c.total,cur)} now</a><div class="p-link">${esc(link)}</div></div>${qr?`<div class="p-qr" data-paylink><img src="${qr}" alt=""><span>Scan to pay</span></div>`:""}</div>`)}
  if(String(inv.notes||"").trim())blocks.push(`<div class="p-notes"><div class="p-lbl">Note</div><div class="t">${esc(inv.notes)}</div></div>`);
  for(const h of blocks){const n=el(h);zone.append(n);if(over(zone)){n.remove();zone=newPage(true);zone.append(n)}}
  pages.forEach((p,i)=>p.querySelector(".pg").textContent=`Page ${i+1} of ${pages.length}`);
  return pages;
}
function togglePreview(){
  S.preview=!S.preview;try{localStorage.setItem("rv_preview",S.preview?"on":"off")}catch{}
  const ed=$(".editor");if(ed){ed.dataset.preview=S.preview?"on":"off";if(!S.preview){S.tab="form";ed.dataset.tab="form";document.querySelectorAll(".mob-tabs [data-tab]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.tab==="form")))}}
  const mt=$(".mob-tabs");if(mt)mt.hidden=!S.preview;
  renderEditorBar();if(S.preview)updatePreview();
  toast(S.preview?"Preview on":"Preview off");
}
function updatePreview(){
  if(S.view!=="editor"||!S.inv||!S.preview)return;
  const box=$("#pvPages");if(!box)return;
  const host=$("#exportHost");
  const pages=buildPages(S.inv,host);
  const w=box.clientWidth||600,sc=w/794;
  box.innerHTML="";
  pages.forEach(p=>{const wrap=document.createElement("div");wrap.className="pv-page";wrap.style.height=(1123*sc)+"px";const cl=p.cloneNode(true);cl.style.transform=`scale(${sc})`;wrap.append(cl);box.append(wrap)});
  $("#pvCount").textContent=pages.length>1?`${pages.length} pages`:"1 page";
}
let lastW=0;new ResizeObserver(()=>{const b=$("#pvPages");const w=b?b.clientWidth:0;if(S.view==="editor"&&w&&Math.abs(w-lastW)>2){lastW=w;updatePreview()}}).observe(document.documentElement);

/* ---------- PDF ---------- */
async function makePdf(){
  const inv=S.inv;const host=$("#exportHost");
  await document.fonts.ready;
  const pages=buildPages(inv,host);
  await Promise.all([...host.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4",compress:true});
  const k=210/794;
  host.style.left="0";host.style.zIndex="-1";
  try{
  for(let i=0;i<pages.length;i++){
    const p=pages[i];
    const canvas=await html2canvas(p,{scale:2.2,useCORS:true,backgroundColor:"#ffffff",logging:false});
    if(i>0)pdf.addPage();
    pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297,undefined,"FAST");
    const pr=p.getBoundingClientRect();
    p.querySelectorAll("[data-paylink]").forEach(a=>{const r=a.getBoundingClientRect();pdf.link((r.left-pr.left)*k,(r.top-pr.top)*k,r.width*k,r.height*k,{url:inv.payoneerLink})});
  }
  }finally{host.style.left="";host.style.zIndex=""}
  pdf.setProperties({title:`Invoice ${inv.number}`,author:"rightVenue",subject:`Invoice for ${inv.buyer?.name||""}`});
  return pdf;
}
function pdfName(inv){return `${inv.number.replace(/\//g,"-")}${inv.buyer?.name?" - "+inv.buyer.name.replace(/[\\/:*?"<>|]/g,""):""}.pdf`}
function fillTpl(t,inv){const c=calc(inv);return String(t||"").replace(/\{buyer\}/g,inv.buyer?.name||"there").replace(/\{number\}/g,inv.number).replace(/\{amount\}/g,fmtMoney(c.total,inv.currency)).replace(/\{due\}/g,fmtDate(inv.dueDate)).replace(/\{link\}/g,inv.payoneerLink||"(payment link not set)")}
/* ---------- PDF & email (standalone) ---------- */
function libsReady(){if(window.jspdf&&window.html2canvas)return true;toast("The PDF tools need an internet connection. Connect and reopen the app.",true);return false}
const IS_TOUCH=matchMedia("(pointer:coarse)").matches;
function pdfFile(pdf,name){return new File([pdf.output("blob")],name,{type:"application/pdf"})}
function canShareFile(f){try{return !!(navigator.canShare&&navigator.canShare({files:[f]}))}catch{return false}}
function shareReadyModal(file,extra){
  openModal(`<div class="modal-h"><h2>Your PDF is ready</h2><button class="btn ghost icon" data-close aria-label="Close">${icon("x")}</button></div><div class="modal-b"><p style="margin:0;color:var(--muted)">Tap below to save it to Files or send it with Mail, Gmail or WhatsApp.</p></div><div class="modal-f"><button class="btn primary g-big" id="shGo">${icon("dl")}Share or save PDF</button></div>`);
  $("#shGo").onclick=async()=>{try{await navigator.share({files:[file],...(extra||{})});closeModal()}catch(e){if(e.name!=="AbortError")toast("Sharing didn't work. Try again.",true)}};
}
async function deliverPdf(pdf,name){
  if(IS_TOUCH){const f=pdfFile(pdf,name);
    if(canShareFile(f)){try{await navigator.share({files:[f]});return}catch(e){if(e.name==="AbortError")return;shareReadyModal(f);return}}}
  pdf.save(name);toast("PDF saved to your Downloads folder");
}
async function downloadPdf(){
  if(!libsReady())return;
  if(!(await ensureSaved()))return;
  const btn=$("#btnPdf");if(btn){btn.disabled=true;btn.lastChild.textContent="Preparing…"}
  try{const pdf=await makePdf();await deliverPdf(pdf,pdfName(S.inv))}
  catch(e){console.error(e);toast("Couldn't create the PDF. Try again.",true)}
  finally{const b=$("#btnPdf");if(b){b.disabled=false;b.lastChild.textContent="PDF"}}
}
function gmailUrl(to,cc,subj,body){
  const q=new URLSearchParams({view:"cm",fs:"1",to,su:subj,body});if(cc)q.set("cc",cc);
  return "https://mail.google.com/mail/?"+q.toString();
}
async function emailModal(){
  if(!(await ensureSaved()))return;
  if(IS_TOUCH&&navigator.canShare)return emailModalPhone();
  const inv=S.inv,s=S.settings;
  openModal(`<div class="modal-h"><h2>Email ${esc(inv.number)}</h2><button class="btn ghost icon" data-close aria-label="Close">${icon("x")}</button></div>
  <form id="mailForm"><div class="modal-b">
    <div class="grid2"><label class="f"><span>To</span><input class="inp" id="m_to" type="email" required value="${esc(inv.buyer?.email||"")}" placeholder="client@company.com"></label><label class="f"><span>CC (optional)</span><input class="inp" id="m_cc" type="email"></label></div>
    <label class="f"><span>Subject</span><input class="inp" id="m_subj" value="${esc(fillTpl(s.emailSubject,inv))}"></label>
    <label class="f"><span>Message</span><textarea class="inp" id="m_body" rows="10">${esc(fillTpl(s.emailBody,inv))}</textarea></label>
    <div class="steps-box"><b>How it works</b><ol><li>Gmail opens in a new tab with everything filled in.</li><li>The invoice PDF saves to your Downloads folder.</li><li>Drag the PDF into the Gmail message and press <b>Send</b>.</li></ol></div>
    <div class="err" id="m_err" hidden></div>
  </div>
  <div class="modal-f"><button type="button" class="btn" id="m_copy">${icon("copy")}Copy message</button><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary" id="m_send">${icon("mail")}Open Gmail & save PDF</button></div></form>`);
  const err=m=>{$("#m_err").hidden=false;$("#m_err").textContent=m};
  $("#m_copy").onclick=async()=>{const t=$("#m_body");try{await navigator.clipboard.writeText(t.value);toast("Message copied")}catch{t.select();toast("Press Ctrl+C to copy")}};
  $("#mailForm").addEventListener("submit",async e=>{
    e.preventDefault();$("#m_err").hidden=true;
    const to=$("#m_to").value.trim(),cc=$("#m_cc").value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to))return err("Enter the buyer's email address.");
    if(cc&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cc))return err("The CC address doesn't look right.");
    const win=window.open(gmailUrl(to,cc,$("#m_subj").value,$("#m_body").value),"_blank");if(win)try{win.opener=null}catch{}
    if(!win)toast("Allow pop-ups for this file so Gmail can open",true);
    if(window.jspdf&&window.html2canvas){try{const pdf=await makePdf();pdf.save(pdfName(inv))}catch{toast("Couldn't create the PDF",true)}}
    else toast("The PDF needs an internet connection",true);
    if(inv.status==="draft"){inv.status="sent";inv.sentAt=new Date().toISOString();await putInvoice(inv)}
    if(inv.buyerId){const b=S.buyers.find(x=>x.id===inv.buyerId);if(b&&!b.email)await putBuyer({...b,email:to})}
    closeModal();toast("Attach the downloaded PDF in Gmail, then press Send");renderEditorBar();updatePreview();
  });
}

async function emailModalPhone(){
  const inv=S.inv,s=S.settings;let file=null;
  openModal(`<div class="modal-h"><h2>Email ${esc(inv.number)}</h2><button class="btn ghost icon" data-close aria-label="Close">${icon("x")}</button></div>
  <div class="modal-b">
    <label class="f"><span>Send to</span><div class="uri" style="margin:0"><code id="p_to">${esc(inv.buyer?.email||"No email saved for this buyer")}</code>${inv.buyer?.email?`<button type="button" class="btn sm" id="p_copy">${icon("copy")}Copy</button>`:""}</div></label>
    <label class="f"><span>Subject</span><input class="inp" id="m_subj" value="${esc(fillTpl(s.emailSubject,inv))}"></label>
    <label class="f"><span>Message</span><textarea class="inp" id="m_body" rows="8">${esc(fillTpl(s.emailBody,inv))}</textarea></label>
    <div class="steps-box"><b>How it works</b><ol><li>Tap <b>Share</b> and choose <b>Mail</b> or <b>Gmail</b>.</li><li>The PDF and message are already in the email.</li><li>Paste the buyer's address in <b>To</b> and send.</li></ol></div>
  </div>
  <div class="modal-f"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn primary" id="p_share" disabled>Preparing PDF…</button></div>`);
  $("#p_copy")?.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(inv.buyer.email);toast("Email address copied")}catch{toast("Press and hold the address to copy it")}});
  try{if(!libsReady())return;const pdf=await makePdf();file=pdfFile(pdf,pdfName(inv))}catch{toast("Couldn't create the PDF",true);return}
  const btn=$("#p_share");if(!btn)return;btn.disabled=false;btn.innerHTML=`${icon("mail")}Share`;
  btn.onclick=async()=>{
    try{await navigator.share({files:[file],title:$("#m_subj").value,text:$("#m_body").value});
      if(inv.status==="draft"){inv.status="sent";inv.sentAt=new Date().toISOString();await putInvoice(inv)}
      closeModal();toast("Invoice shared");renderEditorBar();updatePreview()}
    catch(e){if(e.name!=="AbortError")toast("Sharing didn't work. Try again.",true)}
  };
}
/* ---------- modals ---------- */
function openModal(html){
  $("#modalRoot").innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#mbg").addEventListener("click",e=>{if(e.target.id==="mbg"||e.target.closest("[data-close]"))closeModal()});
}
function closeModal(){$("#modalRoot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#mbg"))closeModal()});
document.querySelectorAll("[data-lock]").forEach(b=>b.addEventListener("click",lockApp));
function confirmModal(title,text,okLabel,onOk){
  openModal(`<div class="modal-h"><h2>${esc(title)}</h2></div><div class="modal-b"><p style="margin:0;color:var(--muted)">${esc(text)}</p></div><div class="modal-f"><button class="btn" data-close>Cancel</button><button class="btn danger solid" id="okBtn">${esc(okLabel)}</button></div>`);
  $("#okBtn").addEventListener("click",async()=>{closeModal();try{await onOk()}catch{toast("That didn't work. Try again.",true)}});
}

/* ---------- common bindings ---------- */
function bindCommon(){
  document.querySelectorAll("[data-open]").forEach(r=>r.addEventListener("click",()=>openInvoice(r.dataset.open)));
  document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{S.filter=b.dataset.filter;render()}));
  const sr=$("#invSearch");if(sr)sr.addEventListener("input",e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#invSearch");n.focus();n.setSelectionRange(pos,pos)});
  const bs=$("#buyerSearch");if(bs)bs.addEventListener("input",e=>{S.bq=e.target.value;const pos=e.target.selectionStart;render();const n=$("#buyerSearch");n.focus();n.setSelectionRange(pos,pos)});
  document.querySelectorAll("[data-buyer-new]").forEach(b=>b.addEventListener("click",()=>buyerModal(null)));
  document.querySelectorAll("[data-buyer]").forEach(c=>{const open=()=>buyerModal(S.buyers.find(x=>x.id===c.dataset.buyer));c.addEventListener("click",open);c.addEventListener("keydown",e=>{if(e.key==="Enter")open()})});
  $("#bzPw")?.addEventListener("click",changePassword);$("#bzBackup")?.addEventListener("click",downloadBackup);$("#bzSwitch")?.addEventListener("click",switchFile);document.querySelector("[data-lock-b]")?.addEventListener("click",lockApp);
  const bf=$("#bizForm");if(bf)bf.addEventListener("submit",async e=>{e.preventDefault();
    try{await putSettings({payoneerLink:$("#s_link").value.trim(),currency:$("#s_cur").value,serviceChargePct:Number($("#s_sc").value)||0,dueDays:Math.max(0,parseInt($("#s_due").value)||0),notes:$("#s_notes").value,emailSubject:$("#s_subj").value,emailBody:$("#s_body").value});toast("Business details saved")}
    catch{toast("Couldn't save. Check your connection and try again.",true)}});
}

document.fonts?.ready.then(()=>{if(S.view==="editor")updatePreview()});
boot();
</script>
